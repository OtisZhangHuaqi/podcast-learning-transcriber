name: Feature request
description: 提议与项目范围一致的新功能
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 隐私、版权、性能和跨平台影响
    validations:
      required: true

