name: Bug report
description: 报告可复现的软件问题；不要提交API Key、Cookie或私人逐字稿
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除日志和截图中的API Key、Cookie、个人路径及私人内容。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 0.4.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows 10, Windows 11, macOS Apple Silicon, macOS Intel, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认内容中不含API Key、Cookie、访问令牌或私人逐字稿
          required: true
        - label: 我只处理有权访问和使用的内容
          required: true

