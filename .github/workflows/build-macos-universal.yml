name: Build macOS Universal release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native tools
        run: bash scripts/prepare-macos-native.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: vendor/darwin-${{ matrix.arch }}
          if-no-files-found: error

  package:
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Read package version
        id: meta
        run: |
          node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: vendor/darwin-arm64
      - uses: actions/download-artifact@v8
        with:
          name: native-x64
          path: vendor/darwin-x64
      - name: Bundle all local models
        run: bash scripts/prepare-models.sh
      - name: Unit tests
        run: pnpm test
      - name: Build Universal app without Developer ID
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build:mac:dir
      - name: Ad-hoc sign, audit, and create single-file DMG
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APP="$(find dist -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          bash scripts/adhoc-sign-macos.sh "$APP"
          bash scripts/verify-macos-app.sh "$APP"
          mkdir -p dist/dmg-root
          mv "$APP" dist/dmg-root/
          cp docs/MACOS_FIRST_OPEN.txt "dist/dmg-root/首次打开说明.txt"
          ln -s /Applications dist/dmg-root/Applications
          rm -rf vendor/models vendor/darwin-arm64 vendor/darwin-x64 node_modules .pnpm
          hdiutil create -volname "播客转录助手 $VERSION" -srcfolder dist/dmg-root -ov -format UDZO "dist/PodcastTranscriber-$VERSION-macOS-Universal-Full.dmg"
          shasum -a 256 "dist/PodcastTranscriber-$VERSION-macOS-Universal-Full.dmg" > "dist/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastTranscriber-${{ steps.meta.outputs.version }}-macOS-Universal
          path: |
            dist/PodcastTranscriber-${{ steps.meta.outputs.version }}-macOS-Universal-Full.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
